name: Pruebas de Integración de Sistemas (SIT)

on:
  push:
    branches: 
      - "main"
      - "develop"
      - "feature/pruebas-sit"
  pull_request:
    branches: 
      - "main"
      - "develop"
      - "feature/pruebas-sit"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias del Backend
      run: |
        python -m pip install --upgrade pip
        # Instalamos las dependencias del backend (Flask, PyMongo, Reportlab, etc.)
        if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
        # Instalamos las dependencias de las pruebas
        pip install -r pruebas_sit/requirements_sit.txt

    - name: Ejecutar Pruebas SIT con Pytest
      run: |
        # Usamos -c /dev/null para forzar a ignorar el pytest.ini de la raíz
        # Y decimos que busque específicamente en la carpeta pruebas_sit
        pytest pruebas_sit/ -v -c /dev/null