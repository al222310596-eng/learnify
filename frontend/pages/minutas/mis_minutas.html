<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learnify | Mis Minutas</title>
    <link rel="stylesheet" href="../../css/base.css">
    <link rel="stylesheet" href="../../css/menu.css">
    <link rel="stylesheet" href="../../css/minutas.css">
    <link rel="stylesheet" href="../../css/temas_oscuro.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="menu-lateral">
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-graduation-cap"></i><span> Learnify</span></h2>
            </div>
            <nav class="sidebar-nav">
                <a href="../../dashboard.html" class="menu-item">
                    <i class="fas fa-chart-line"></i><span> Dashboard</span>
                </a>
                <a href="../mis_equipos.html" class="menu-item">
                    <i class="fas fa-users"></i><span> Mis Equipos</span>
                </a>
                <a href="../analisis/analisis_alumnos.html" class="menu-item">
                    <i class="fas fa-chart-pie"></i><span> Análisis</span>
                </a>
                <a href="../duales/mis_duales.html" class="menu-item">
                    <i class="fas fa-briefcase"></i><span> Duales</span>
                </a>
                <a href="../estadias/mis_estadias.html" class="menu-item">
                    <i class="fas fa-building"></i><span> Estadías</span>
                </a>
                <a href="mis_minutas.html" class="menu-item active">
                    <i class="fas fa-file-alt"></i><span> Minutas</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info-sidebar" id="userInfoSidebar"></div>
                <button class="btn-cerrar-sesion" onclick="cerrarSesion()">
                    <i class="fas fa-sign-out-alt"></i><span> Cerrar sesión</span>
                </button>
            </div>
        </aside>

        <main class="main-content">
            <div class="minutas-container">
                <div class="header-minutas">
                    <div>
                        <h2><i class="fas fa-file-alt"></i> Mis Minutas</h2>
                        <p class="subtitulo">Registro formal de reuniones y acuerdos</p>
                    </div>
                    
                    <div class="acciones-header">
                        <!-- Acciones solo para MAESTROS (HU34) -->
                        <div id="accionesMaestroMinutas" class="acciones-importar" style="display: none;">
                            <a href="/api/minutas/importar/plantilla" class="btn secundario" download>
                                <i class="fas fa-file-download"></i> Descargar plantilla
                            </a>
                            <button type="button" id="btnImportarExcelMinutas" class="btn primario">
                                <i class="fas fa-file-excel"></i> Importar desde Excel
                            </button>
                            <input type="file" id="inputExcelMinutas" accept=".xlsx" style="display: none;">
                        </div>
                        
                        <a href="crear_minuta.html" class="btn primario">
                            <i class="fas fa-plus-circle"></i> Nueva Minuta
                        </a>
                    </div>
                </div>

                <div id="mensaje" class="mensaje"></div>

                <div class="buscador-container">
                    <i class="fas fa-search"></i>
                    <input type="text" id="buscadorMinutas" placeholder="Buscar por asunto o área...">
                </div>

                <div id="minutasContainer" class="minutas-grid">
                    <div class="sin-minutas">
                        <i class="fas fa-spinner fa-pulse"></i> Cargando minutas...
                    </div>
                </div>
            </div>

            <div id="formatoImprimible" class="formato-imprimible"></div>
        </main>
    </div>

    <!-- Modal con el resumen de la importación (HU34) -->
    <!-- MOVIDO FUERA DEL MAIN PARA QUE FLOTE CORRECTAMENTE -->
        <!-- Modal con el resumen de la importación (HU34) -->
    <div id="modalResumenImportacionMinutas" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.5); z-index: 99999; align-items: center; justify-content: center; backdrop-filter: blur(4px);">
        
        <div style="background: white; border-radius: 24px; width: 90%; max-width: 450px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.25); animation: modalFadeIn 0.3s ease-out;">
            
            <div style="background: #fef3c7; padding: 1.25rem; text-align: center; border-bottom: 1px solid #fde68a;">
                <i class="fas fa-file-excel" style="font-size: 2.5rem; color: #d97706; margin-bottom: 0.5rem; display: block;"></i>
                <h3 style="margin: 0; color: #92400e; font-size: 1.2rem;">Resultado de la importación</h3>
            </div>
            
            <div id="resumenImportacionCuerpoMinutas" style="padding: 1.5rem; text-align: center; max-height: 60vh; overflow-y: auto; color: #1e293b;">
                <!-- Aquí se inyecta el contenido desde JS -->
            </div>
            
            <div style="display: flex; gap: 1rem; padding: 1rem 1.5rem 1.5rem; background: #f8fafc;">
                <button type="button" id="btnCerrarResumenImportacionMinutas" class="btn primario" style="flex: 1; margin: 0; display: inline-flex; justify-content: center; align-items: center; gap: 0.5rem;">
                    <i class="fas fa-check"></i> Cerrar
                </button>
            </div>
            
        </div>
    </div>
    <script src="../../js/menu.js"></script>
    <script src="../../js/minutas.js"></script>
</body>
</html>
